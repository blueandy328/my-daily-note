<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日备忘录</title>
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #16213e;
            border-radius: 24px;
            padding: 24px 20px 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        /* 同步状态指示器 */
        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 8px 16px;
            background: #0a1a2e;
            border-radius: 12px;
            font-size: 13px;
        }
        .sync-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4a4a4a;
        }
        .sync-status .dot.synced {
            background: #4a8bc2;
        }
        .sync-status .dot.syncing {
            background: #f0c040;
            animation: pulse 1s infinite;
        }
        .sync-status .dot.error {
            background: #c24a4a;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #f0f0f0;
            letter-spacing: 1px;
        }
        .date-picker {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #1a4a7a;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 16px;
            outline: none;
        }
        .date-picker:focus {
            border-color: #4a8bc2;
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2a4a;
            padding-bottom: 8px;
        }
        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 500;
            transition: all 0.2s;
            background: transparent;
            border: none;
            color: #8a8aa0;
            font-size: 15px;
        }
        .tab.active {
            background: #0f3460;
            color: #f0f0f0;
        }
        .tab:hover {
            background: #1a2a4a;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .input-group input, .input-group textarea {
            flex: 1;
            min-width: 120px;
            background: #0a1a2e;
            border: 1px solid #2a3a5a;
            border-radius: 12px;
            padding: 12px 14px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #4a8bc2;
        }
        .input-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .btn {
            background: #0f3460;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            color: #f0f0f0;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn:hover {
            background: #1a4a7a;
        }
        .btn-danger {
            background: #5a1a2e;
        }
        .btn-danger:hover {
            background: #7a2a3e;
        }
        .list {
            list-style: none;
            margin-top: 10px;
        }
        .list li {
            background: #1a2a3e;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 10px;
            border-left: 4px solid #4a8bc2;
        }
        .list li.completed {
            opacity: 0.7;
            border-left-color: #2a6a3a;
        }
        .list li .item-content {
            flex: 1;
            min-width: 100px;
        }
        .list li .item-content .title {
            font-weight: 500;
            margin-bottom: 4px;
        }
        .list li .item-content .note {
            font-size: 13px;
            color: #a0a0b0;
        }
        .list li .checkbox {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            accent-color: #4a8bc2;
        }
        .list li .actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .list li .actions button {
            background: #2a3a5a;
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 13px;
        }
        .list li .actions button:hover {
            background: #3a4a6a;
        }
        .list li .actions .delete-btn {
            background: #5a1a2e;
        }
        .list li .actions .delete-btn:hover {
            background: #7a2a3e;
        }
        .finance-summary {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 16px;
            background: #0a1a2e;
            border-radius: 16px;
        }
        .finance-summary > div {
            flex: 1;
            min-width: 100px;
        }
        .finance-summary .label {
            font-size: 13px;
            color: #8a8aa0;
        }
        .finance-summary .value {
            font-size: 20px;
            font-weight: 600;
        }
        .finance-summary .income {
            color: #4a8bc2;
        }
        .finance-summary .expense {
            color: #c24a4a;
        }
        .finance-summary .balance {
            color: #f0f0f0;
        }
        .finance-input {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .finance-input input, .finance-input select {
            background: #0a1a2e;
            border: 1px solid #2a3a5a;
            border-radius: 12px;
            padding: 10px 14px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
        }
        .finance-input input:focus, .finance-input select:focus {
            border-color: #4a8bc2;
        }
        .finance-input select {
            min-width: 80px;
        }
        .finance-list li {
            border-left-color: #c24a4a;
        }
        .finance-list li.income-item {
            border-left-color: #4a8bc2;
        }
        .hidden {
            display: none !important;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #5a5a7a;
            font-size: 13px;
        }
        @media (max-width: 480px) {
            .container {
                padding: 16px 12px;
            }
            .header h1 {
                font-size: 20px;
            }
            .input-group input, .input-group textarea {
                font-size: 14px;
                padding: 10px;
            }
            .btn {
                padding: 10px 14px;
                font-size: 14px;
            }
            .list li {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- 同步状态指示器 -->
    <div class="sync-status">
        <span class="dot" id="syncDot"></span>
        <span id="syncText">正在同步...</span>
    </div>

    <!-- 头部 -->
    <div class="header">
        <h1>📋 每日备忘录</h1>
        <input type="date" class="date-picker" id="datePicker">
    </div>

    <!-- 导航标签 -->
    <div class="tabs">
        <button class="tab active" data-tab="todo">📝 待办</button>
        <button class="tab" data-tab="summary">📄 总结</button>
        <button class="tab" data-tab="finance">💰 记账</button>
    </div>

    <!-- 待办事项 -->
    <div id="todoPanel" class="panel">
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="输入待办事项...">
            <input type="text" id="todoNote" placeholder="备注（可选）">
            <button class="btn" id="addTodoBtn">添加</button>
        </div>
        <ul class="list" id="todoList"></ul>
    </div>

    <!-- 日终总结 -->
    <div id="summaryPanel" class="panel hidden">
        <div class="input-group">
            <textarea id="summaryInput" placeholder="写下今天的总结..."></textarea>
            <button class="btn" id="saveSummaryBtn">保存</button>
        </div>
        <div id="summaryDisplay" style="background:#0a1a2e; border-radius:12px; padding:16px; margin-top:12px; white-space:pre-wrap;"></div>
    </div>

    <!-- 记账模块 -->
    <div id="financePanel" class="panel hidden">
        <div class="finance-summary">
            <div>
                <div class="label">收入</div>
                <div class="value income" id="totalIncome">0.00</div>
            </div>
            <div>
                <div class="label">支出</div>
                <div class="value expense" id="totalExpense">0.00</div>
            </div>
            <div>
                <div class="label">结余</div>
                <div class="value balance" id="balance">0.00</div>
            </div>
        </div>
        <div class="finance-input">
            <select id="financeType">
                <option value="income">收入</option>
                <option value="expense">支出</option>
            </select>
            <input type="number" id="financeAmount" placeholder="金额" step="0.01">
            <input type="text" id="financeDesc" placeholder="说明（可选）">
            <button class="btn" id="addFinanceBtn">添加</button>
        </div>
        <ul class="list finance-list" id="financeList"></ul>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        💾 数据实时同步至云端 &nbsp;|&nbsp; <a href="https://console.firebase.google.com" target="_blank">Firebase 控制台</a>
    </div>
</div>

<script>
    // ==========================================
    // 1. 配置 Firebase（替换为你的配置）
    // ==========================================
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCn8iDouqU59HcdmOnx4GiU9K-jXOzw65A",
  authDomain: "daily-note-33904.firebaseapp.com",
  projectId: "daily-note-33904",
  storageBucket: "daily-note-33904.firebasestorage.app",
  messagingSenderId: "68183369236",
  appId: "1:68183369236:web:3c96d1e1cc43f05264e901",
  measurementId: "G-QH8FY8G706"
};

    // ==========================================
    // 2. 同步状态管理
    // ==========================================
    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncText');

    function setSyncStatus(status, message) {
        syncDot.className = 'dot';
        if (status === 'synced') {
            syncDot.classList.add('synced');
            syncText.textContent = message || '已同步';
        } else if (status === 'syncing') {
            syncDot.classList.add('syncing');
            syncText.textContent = message || '正在同步...';
        } else if (status === 'error') {
            syncDot.classList.add('error');
            syncText.textContent = message || '同步失败';
        }
    }

    // ==========================================
    // 3. 数据同步函数
    // ==========================================
    async function syncDataToFirebase(userId, data) {
        try {
            setSyncStatus('syncing', '正在保存到云端...');
            await db.collection('memoData').doc(userId).set({
                data: data,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            setSyncStatus('synced', '已同步');
        } catch (error) {
            console.error('保存到Firebase失败:', error);
            setSyncStatus('error', '保存失败，请检查网络');
        }
    }

    async function fetchDataFromFirebase(userId) {
        try {
            setSyncStatus('syncing', '正在从云端加载...');
            const doc = await db.collection('memoData').doc(userId).get();
            if (doc.exists) {
                setSyncStatus('synced', '已同步');
                return doc.data().data;
            } else {
                setSyncStatus('synced', '暂无云端数据');
                return null;
            }
        } catch (error) {
            console.error('从Firebase加载失败:', error);
            setSyncStatus('error', '加载失败，使用本地数据');
            return null;
        }
    }

    // 实时监听云端数据变化
    function subscribeToFirebase(userId) {
        db.collection('memoData').doc(userId).onSnapshot((doc) => {
            if (doc.exists && doc.data().data) {
                const cloudData = doc.data().data;
                const localData = getData();
                // 仅当云端数据更新时，才更新本地（避免循环写回）
                if (JSON.stringify(cloudData) !== JSON.stringify(localData)) {
                    console.log('检测到云端数据更新，正在同步到本地...');
                    localStorage.setItem('memoData', JSON.stringify(cloudData));
                    renderAll();
                }
            }
        }, (error) => {
            console.error('实时监听失败:', error);
        });
    }

    // ==========================================
    // 4. 本地数据管理（保持不变）
    // ==========================================
    function getData() {
        const raw = localStorage.getItem('memoData');
        if (raw) {
            try { return JSON.parse(raw); } catch(e) { console.error('数据解析失败', e); }
        }
        return {};
    }

    function saveData(data) {
        localStorage.setItem('memoData', JSON.stringify(data));
        // 每次保存本地数据时，自动同步到云端
        const userId = 'default_user'; // 可改为用户ID
        syncDataToFirebase(userId, data);
    }

    function getCurrentDate() {
        const picker = document.getElementById('datePicker');
        return picker ? picker.value : '';
    }

    function getDayData(date) {
        const data = getData();
        if (!data[date]) {
            data[date] = { todo: [], summary: '', finance: [] };
            saveData(data);
        }
        return data[date];
    }

    function setDayData(date, dayData) {
        const data = getData();
        data[date] = dayData;
        saveData(data);
    }

    // ==========================================
    // 5. DOM 引用与渲染（保持不变）
    // ==========================================
    const datePicker = document.getElementById('datePicker');
    const todoPanel = document.getElementById('todoPanel');
    const summaryPanel = document.getElementById('summaryPanel');
    const financePanel = document.getElementById('financePanel');
    const todoList = document.getElementById('todoList');
    const todoInput = document.getElementById('todoInput');
    const todoNote = document.getElementById('todoNote');
    const addTodoBtn = document.getElementById('addTodoBtn');
    const summaryInput = document.getElementById('summaryInput');
    const saveSummaryBtn = document.getElementById('saveSummaryBtn');
    const summaryDisplay = document.getElementById('summaryDisplay');
    const financeType = document.getElementById('financeType');
    const financeAmount = document.getElementById('financeAmount');
    const financeDesc = document.getElementById('financeDesc');
    const addFinanceBtn = document.getElementById('addFinanceBtn');
    const financeList = document.getElementById('financeList');
    const totalIncomeEl = document.getElementById('totalIncome');
    const totalExpenseEl = document.getElementById('totalExpense');
    const balanceEl = document.getElementById('balance');

    // 设置默认日期
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    datePicker.value = `${yyyy}-${mm}-${dd}`;

    // ==========================================
    // 6. 渲染函数（保持不变）
    // ==========================================
    function renderAll() {
        const date = getCurrentDate();
        const dayData = getDayData(date);
        renderTodo(dayData.todo);
        renderSummary(dayData.summary);
        renderFinance(dayData.finance);
    }

    function renderTodo(todos) {
        if (!todos) todos = [];
        todoList.innerHTML = '';
        todos.forEach((item, index) => {
            const li = document.createElement('li');
            if (item.done) li.classList.add('completed');
            li.innerHTML = `
                <input type="checkbox" class="checkbox" ${item.done ? 'checked' : ''} data-index="${index}">
                <div class="item-content">
                    <div class="title">${escapeHtml(item.title)}</div>
                    ${item.note ? `<div class="note">${escapeHtml(item.note)}</div>` : ''}
                </div>
                <div class="actions">
                    <button class="delete-btn" data-type="todo" data-index="${index}">删除</button>
                </div>
            `;
            todoList.appendChild(li);
        });
        todoList.querySelectorAll('.checkbox').forEach(cb => {
            cb.addEventListener('change', function(e) {
                const idx = parseInt(this.dataset.index);
                const date = getCurrentDate();
                const dayData = getDayData(date);
                dayData.todo[idx].done = this.checked;
                setDayData(date, dayData);
                renderTodo(dayData.todo);
            });
        });
        todoList.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const idx = parseInt(this.dataset.index);
                const date = getCurrentDate();
                const dayData = getDayData(date);
                dayData.todo.splice(idx, 1);
                setDayData(date, dayData);
                renderAll();
            });
        });
    }

    function renderSummary(summary) {
        summaryDisplay.textContent = summary || '今天还没有写总结。';
        summaryInput.value = summary || '';
    }

    function renderFinance(finances) {
        if (!finances) finances = [];
        let totalIncome = 0, totalExpense = 0;
        financeList.innerHTML = '';
        finances.forEach((item, index) => {
            const li = document.createElement('li');
            if (item.type === 'income') li.classList.add('income-item');
            const sign = item.type === 'income' ? '+' : '-';
            li.innerHTML = `
                <div class="item-content">
                    <div class="title">${sign} ¥${Number(item.amount).toFixed(2)}</div>
                    ${item.desc ? `<div class="note">${escapeHtml(item.desc)}</div>` : ''}
                </div>
                <div class="actions">
                    <button class="delete-btn" data-type="finance" data-index="${index}">删除</button>
                </div>
            `;
            financeList.appendChild(li);
            if (item.type === 'income') totalIncome += Number(item.amount);
            else totalExpense += Number(item.amount);
        });
        totalIncomeEl.textContent = totalIncome.toFixed(2);
        totalExpenseEl.textContent = totalExpense.toFixed(2);
        balanceEl.textContent = (totalIncome - totalExpense).toFixed(2);
        financeList.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const idx = parseInt(this.dataset.index);
                const date = getCurrentDate();
                const dayData = getDayData(date);
                dayData.finance.splice(idx, 1);
                setDayData(date, dayData);
                renderAll();
            });
        });
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ==========================================
    // 7. 事件绑定
    // ==========================================
    datePicker.addEventListener('change', function() {
        renderAll();
    });

    addTodoBtn.addEventListener('click', function() {
        const title = todoInput.value.trim();
        const note = todoNote.value.trim();
        if (!title) return;
        const date = getCurrentDate();
        const dayData = getDayData(date);
        dayData.todo.push({ title, note, done: false });
        setDayData(date, dayData);
        todoInput.value = '';
        todoNote.value = '';
        renderTodo(dayData.todo);
    });

    saveSummaryBtn.addEventListener('click', function() {
        const summary = summaryInput.value.trim();
        const date = getCurrentDate();
        const dayData = getDayData(date);
        dayData.summary = summary;
        setDayData(date, dayData);
        renderSummary(summary);
    });

    addFinanceBtn.addEventListener('click', function() {
        const type = financeType.value;
        const amount = parseFloat(financeAmount.value);
        const desc = financeDesc.value.trim();
        if (isNaN(amount) || amount <= 0) return;
        const date = getCurrentDate();
        const dayData = getDayData(date);
        dayData.finance.push({ type, amount, desc });
        setDayData(date, dayData);
        financeAmount.value = '';
        financeDesc.value = '';
        renderFinance(dayData.finance);
    });

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const target = this.dataset.tab;
            todoPanel.classList.add('hidden');
            summaryPanel.classList.add('hidden');
            financePanel.classList.add('hidden');
            if (target === 'todo') todoPanel.classList.remove('hidden');
            else if (target === 'summary') summaryPanel.classList.remove('hidden');
            else if (target === 'finance') financePanel.classList.remove('hidden');
        });
    });

    // ==========================================
    // 8. 初始化：从云端加载数据
    // ==========================================
    async function initializeApp() {
        const userId = 'default_user';
        
        // 尝试从云端加载数据
        const cloudData = await fetchDataFromFirebase(userId);
        if (cloudData) {
            localStorage.setItem('memoData', JSON.stringify(cloudData));
        }
        
        // 启动实时监听
        subscribeToFirebase(userId);
        
        // 渲染界面
        renderAll();
        
        // 如果当前没有云端数据，立即同步一次
        if (!cloudData) {
            const localData = getData();
            if (Object.keys(localData).length > 0) {
                syncDataToFirebase(userId, localData);
            }
        }
    }

    // 启动应用
    initializeApp();
</script>
</body>
</html>
