<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日备忘录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #16213e;
            border-radius: 24px;
            padding: 24px 20px 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #f0f0f0;
            letter-spacing: 1px;
        }
        .date-picker {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #1a4a7a;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 16px;
            outline: none;
        }
        .date-picker:focus {
            border-color: #4a8bc2;
        }
        /* 导航标签 */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2a4a;
            padding-bottom: 8px;
        }
        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 500;
            transition: all 0.2s;
            background: transparent;
            border: none;
            color: #8a8aa0;
            font-size: 15px;
        }
        .tab.active {
            background: #0f3460;
            color: #f0f0f0;
        }
        .tab:hover {
            background: #1a2a4a;
        }
        /* 通用输入框 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .input-group input, .input-group textarea {
            flex: 1;
            min-width: 120px;
            background: #0a1a2e;
            border: 1px solid #2a3a5a;
            border-radius: 12px;
            padding: 12px 14px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #4a8bc2;
        }
        .input-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .btn {
            background: #0f3460;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            color: #f0f0f0;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn:hover {
            background: #1a4a7a;
        }
        .btn-danger {
            background: #5a1a2e;
        }
        .btn-danger:hover {
            background: #7a2a3e;
        }
        /* 列表样式 */
        .list {
            list-style: none;
            margin-top: 10px;
        }
        .list li {
            background: #1a2a3e;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 10px;
            border-left: 4px solid #4a8bc2;
        }
        .list li.completed {
            opacity: 0.7;
            border-left-color: #2a6a3a;
        }
        .list li .item-content {
            flex: 1;
            min-width: 100px;
        }
        .list li .item-content .title {
            font-weight: 500;
            margin-bottom: 4px;
        }
        .list li .item-content .note {
            font-size: 13px;
            color: #a0a0b0;
        }
        .list li .checkbox {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            accent-color: #4a8bc2;
        }
        .list li .actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .list li .actions button {
            background: #2a3a5a;
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 13px;
        }
        .list li .actions button:hover {
            background: #3a4a6a;
        }
        .list li .actions .delete-btn {
            background: #5a1a2e;
        }
        .list li .actions .delete-btn:hover {
            background: #7a2a3e;
        }
        /* 记账模块 */
        .finance-summary {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 16px;
            background: #0a1a2e;
            border-radius: 16px;
        }
        .finance-summary > div {
            flex: 1;
            min-width: 100px;
        }
        .finance-summary .label {
            font-size: 13px;
            color: #8a8aa0;
        }
        .finance-summary .value {
            font-size: 20px;
            font-weight: 600;
        }
        .finance-summary .income {
            color: #4a8bc2;
        }
        .finance-summary .expense {
            color: #c24a4a;
        }
        .finance-summary .balance {
            color: #f0f0f0;
        }
        .finance-input {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .finance-input input, .finance-input select {
            background: #0a1a2e;
            border: 1px solid #2a3a5a;
            border-radius: 12px;
            padding: 10px 14px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
        }
        .finance-input input:focus, .finance-input select:focus {
            border-color: #4a8bc2;
        }
        .finance-input select {
            min-width: 80px;
        }
        .finance-list li {
            border-left-color: #c24a4a;
        }
        .finance-list li.income-item {
            border-left-color: #4a8bc2;
        }
        /* 隐藏工具 */
        .hidden {
            display: none !important;
        }
        /* 页脚 GitHub 同步 */
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #5a5a7a;
            font-size: 13px;
        }
        .footer a {
            color: #4a8bc2;
            text-decoration: none;
        }
        /* 手机端适配 */
        @media (max-width: 480px) {
            .container {
                padding: 16px 12px;
            }
            .header h1 {
                font-size: 20px;
            }
            .input-group input, .input-group textarea {
                font-size: 14px;
                padding: 10px;
            }
            .btn {
                padding: 10px 14px;
                font-size: 14px;
            }
            .list li {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- 头部 -->
    <div class="header">
        <h1>📋 每日备忘录</h1>
        <input type="date" class="date-picker" id="datePicker">
    </div>

    <!-- 导航标签 -->
    <div class="tabs">
        <button class="tab active" data-tab="todo">📝 待办</button>
        <button class="tab" data-tab="summary">📄 总结</button>
        <button class="tab" data-tab="finance">💰 记账</button>
    </div>

    <!-- 待办事项 -->
    <div id="todoPanel" class="panel">
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="输入待办事项...">
            <input type="text" id="todoNote" placeholder="备注（可选）">
            <button class="btn" id="addTodoBtn">添加</button>
        </div>
        <ul class="list" id="todoList"></ul>
    </div>

    <!-- 日终总结 -->
    <div id="summaryPanel" class="panel hidden">
        <div class="input-group">
            <textarea id="summaryInput" placeholder="写下今天的总结..."></textarea>
            <button class="btn" id="saveSummaryBtn">保存</button>
        </div>
        <div id="summaryDisplay" style="background:#0a1a2e; border-radius:12px; padding:16px; margin-top:12px; white-space:pre-wrap;"></div>
    </div>

    <!-- 记账模块 -->
    <div id="financePanel" class="panel hidden">
        <div class="finance-summary">
            <div>
                <div class="label">收入</div>
                <div class="value income" id="totalIncome">0.00</div>
            </div>
            <div>
                <div class="label">支出</div>
                <div class="value expense" id="totalExpense">0.00</div>
            </div>
            <div>
                <div class="label">结余</div>
                <div class="value balance" id="balance">0.00</div>
            </div>
        </div>
        <div class="finance-input">
            <select id="financeType">
                <option value="income">收入</option>
                <option value="expense">支出</option>
            </select>
            <input type="number" id="financeAmount" placeholder="金额" step="0.01">
            <input type="text" id="financeDesc" placeholder="说明（可选）">
            <button class="btn" id="addFinanceBtn">添加</button>
        </div>
        <ul class="list finance-list" id="financeList"></ul>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        💾 数据自动保存至本地 &nbsp;|&nbsp; <a href="#" id="githubLink">GitHub 同步配置</a>
    </div>
</div>

<script>
    (function() {
        // --- 数据存储与初始化 ---
        function getData() {
            const raw = localStorage.getItem('memoData');
            if (raw) {
                try { return JSON.parse(raw); } catch(e) { console.error('数据解析失败', e); }
            }
            return {};
        }

        function saveData(data) {
            localStorage.setItem('memoData', JSON.stringify(data));
        }

        // 获取当前日期
        function getCurrentDate() {
            const picker = document.getElementById('datePicker');
            return picker ? picker.value : '';
        }

        // 获取指定日期的记录
        function getDayData(date) {
            const data = getData();
            if (!data[date]) {
                data[date] = { todo: [], summary: '', finance: [] };
                saveData(data);
            }
            return data[date];
        }

        // 保存指定日期的记录
        function setDayData(date, dayData) {
            const data = getData();
            data[date] = dayData;
            saveData(data);
        }

        // --- DOM 引用 ---
        const datePicker = document.getElementById('datePicker');
        const todoPanel = document.getElementById('todoPanel');
        const summaryPanel = document.getElementById('summaryPanel');
        const financePanel = document.getElementById('financePanel');
        const todoList = document.getElementById('todoList');
        const todoInput = document.getElementById('todoInput');
        const todoNote = document.getElementById('todoNote');
        const addTodoBtn = document.getElementById('addTodoBtn');
        const summaryInput = document.getElementById('summaryInput');
        const saveSummaryBtn = document.getElementById('saveSummaryBtn');
        const summaryDisplay = document.getElementById('summaryDisplay');
        const financeType = document.getElementById('financeType');
        const financeAmount = document.getElementById('financeAmount');
        const financeDesc = document.getElementById('financeDesc');
        const addFinanceBtn = document.getElementById('addFinanceBtn');
        const financeList = document.getElementById('financeList');
        const totalIncomeEl = document.getElementById('totalIncome');
        const totalExpenseEl = document.getElementById('totalExpense');
        const balanceEl = document.getElementById('balance');

        // --- 设置默认日期为今天 ---
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        datePicker.value = `${yyyy}-${mm}-${dd}`;

        // --- 渲染函数 ---
        function renderAll() {
            const date = getCurrentDate();
            const dayData = getDayData(date);

            // 渲染待办
            renderTodo(dayData.todo);
            // 渲染总结
            renderSummary(dayData.summary);
            // 渲染记账
            renderFinance(dayData.finance);
        }

        // 渲染待办
        function renderTodo(todos) {
            if (!todos) todos = [];
            todoList.innerHTML = '';
            todos.forEach((item, index) => {
                const li = document.createElement('li');
                if (item.done) li.classList.add('completed');
                li.innerHTML = `
                    <input type="checkbox" class="checkbox" ${item.done ? 'checked' : ''} data-index="${index}">
                    <div class="item-content">
                        <div class="title">${escapeHtml(item.title)}</div>
                        ${item.note ? `<div class="note">${escapeHtml(item.note)}</div>` : ''}
                    </div>
                    <div class="actions">
                        <button class="delete-btn" data-type="todo" data-index="${index}">删除</button>
                    </div>
                `;
                todoList.appendChild(li);
            });
            // 绑定复选框事件
            todoList.querySelectorAll('.checkbox').forEach(cb => {
                cb.addEventListener('change', function(e) {
                    const idx = parseInt(this.dataset.index);
                    const date = getCurrentDate();
                    const dayData = getDayData(date);
                    dayData.todo[idx].done = this.checked;
                    setDayData(date, dayData);
                    renderTodo(dayData.todo); // 刷新样式
                });
            });
            // 绑定删除事件
            todoList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const idx = parseInt(this.dataset.index);
                    const date = getCurrentDate();
                    const dayData = getDayData(date);
                    dayData.todo.splice(idx, 1);
                    setDayData(date, dayData);
                    renderAll();
                });
            });
        }

        // 渲染总结
        function renderSummary(summary) {
            summaryDisplay.textContent = summary || '今天还没有写总结。';
            summaryInput.value = summary || '';
        }

        // 渲染记账
        function renderFinance(finances) {
            if (!finances) finances = [];
            let totalIncome = 0, totalExpense = 0;
            financeList.innerHTML = '';
            finances.forEach((item, index) => {
                const li = document.createElement('li');
                if (item.type === 'income') li.classList.add('income-item');
                const sign = item.type === 'income' ? '+' : '-';
                li.innerHTML = `
                    <div class="item-content">
                        <div class="title">${sign} ¥${Number(item.amount).toFixed(2)}</div>
                        ${item.desc ? `<div class="note">${escapeHtml(item.desc)}</div>` : ''}
                    </div>
                    <div class="actions">
                        <button class="delete-btn" data-type="finance" data-index="${index}">删除</button>
                    </div>
                `;
                financeList.appendChild(li);
                if (item.type === 'income') totalIncome += Number(item.amount);
                else totalExpense += Number(item.amount);
            });
            totalIncomeEl.textContent = totalIncome.toFixed(2);
            totalExpenseEl.textContent = totalExpense.toFixed(2);
            balanceEl.textContent = (totalIncome - totalExpense).toFixed(2);
            // 绑定删除事件
            financeList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const idx = parseInt(this.dataset.index);
                    const date = getCurrentDate();
                    const dayData = getDayData(date);
                    dayData.finance.splice(idx, 1);
                    setDayData(date, dayData);
                    renderAll();
                });
            });
        }

        // 简单转义
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- 事件绑定 ---

        // 日期切换
        datePicker.addEventListener('change', function() {
            renderAll();
        });

        // 添加待办
        addTodoBtn.addEventListener('click', function() {
            const title = todoInput.value.trim();
            const note = todoNote.value.trim();
            if (!title) return;
            const date = getCurrentDate();
            const dayData = getDayData(date);
            dayData.todo.push({ title, note, done: false });
            setDayData(date, dayData);
            todoInput.value = '';
            todoNote.value = '';
            renderTodo(dayData.todo);
        });

        // 保存总结
        saveSummaryBtn.addEventListener('click', function() {
            const summary = summaryInput.value.trim();
            const date = getCurrentDate();
            const dayData = getDayData(date);
            dayData.summary = summary;
            setDayData(date, dayData);
            renderSummary(summary);
        });

        // 添加记账
        addFinanceBtn.addEventListener('click', function() {
            const type = financeType.value;
            const amount = parseFloat(financeAmount.value);
            const desc = financeDesc.value.trim();
            if (isNaN(amount) || amount <= 0) return;
            const date = getCurrentDate();
            const dayData = getDayData(date);
            dayData.finance.push({ type, amount, desc });
            setDayData(date, dayData);
            financeAmount.value = '';
            financeDesc.value = '';
            renderFinance(dayData.finance);
        });

        // 标签切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const target = this.dataset.tab;
                todoPanel.classList.add('hidden');
                summaryPanel.classList.add('hidden');
                financePanel.classList.add('hidden');
                if (target === 'todo') todoPanel.classList.remove('hidden');
                else if (target === 'summary') summaryPanel.classList.remove('hidden');
                else if (target === 'finance') financePanel.classList.remove('hidden');
            });
        });

        // 初始渲染
        renderAll();
    })();
</script>
</body>
</html>
