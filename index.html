<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日备忘录</title>
    <!-- 使用国内可访问的 CDN 镜像 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-firestore-compat.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #16213e;
            border-radius: 24px;
            padding: 24px 20px 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        /* 同步状态指示器 */
        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 8px 16px;
            background: #0a1a2e;
            border-radius: 12px;
            font-size: 13px;
        }
        .sync-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4a4a4a;
        }
        .sync-status .dot.synced {
            background: #4a8bc2;
        }
        .sync-status .dot.syncing {
            background: #f0c040;
            animation: pulse 1s infinite;
        }
        .sync-status .dot.error {
            background: #c24a4a;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #f0f0f0;
            letter-spacing: 1px;
        }
        .date-picker {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #1a4a7a;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 16px;
            outline: none;
        }
        .date-picker:focus {
            border-color: #4a8bc2;
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2a4a;
            padding-bottom: 8px;
        }
        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 500;
            transition: all 0.2s;
            background: transparent;
            border: none;
            color: #8a8aa0;
            font-size: 15px;
        }
        .tab.active {
            background: #0f3460;
            color: #f0f0f0;
        }
        .tab:hover {
            background: #1a2a4a;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .inp
