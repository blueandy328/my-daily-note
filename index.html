<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>云端笔记 & 账本 | GitHub Sync</title>
<style>
  :root {
    --bg: #1e1e2e; --card: #2d2d3f; --border: #44475a;
    --text: #cdd6f4; --text-sec: #a6adc8; --accent: #89b4fa;
    --success: #a6e3a1; --warn: #f9e2af; --danger: #f38ba8;
    --input-bg: #181825; --radius: 10px; --shadow: 0 4px 12px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; outline: none; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 15px; }
  
  /* 顶部 */
  header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 15px; }
  h1 { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: var(--radius); cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); color: var(--bg); border: none; }

  /* 标签页 */
  .tabs { display: flex; gap: 10px; margin-bottom: 15px; background: var(--card); padding: 4px; border-radius: var(--radius); }
  .tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; border-radius: 8px; font-size: 0.9rem; color: var(--text-sec); transition: 0.2s; }
  .tab.active { background: var(--input-bg); color: var(--text); font-weight: 500; }

  /* 日期控制 */
  .date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
  input[type="date"] { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: var(--radius); }

  /* 内容区 */
  .content { flex: 1; background: var(--card); border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); overflow-y: auto; position: relative; }
  
  /* 事项列表 */
  .task-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); animation: fadeIn 0.2s; }
  .task-item:last-child { border-bottom: none; }
  .task-check { width: 20px; height: 20px; accent-color: var(--success); cursor: pointer; }
  .task-text { flex: 1; background: transparent; color: var(--text); border: none; font-size: 1rem; padding: 4px; }
  .task-note { width: 80px; background: var(--input-bg); color: var(--text-sec); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 0.85rem; }
  .del-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0 5px; }
  .add-btn { width: 100%; padding: 10px; margin-top: 10px; border: 1px dashed var(--border); background: transparent; color: var(--text-sec); border-radius: var(--radius); cursor: pointer; }

  /* 记账模块 */
  .exp-form { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 8px; margin-bottom: 15px; }
  .exp-form input, .exp-form select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: var(--radius); }
  .exp-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  .exp-amount { color: var(--warn); font-weight: 500; }
  .total-row { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 10px; border-top: 2px solid var(--border); font-weight: 600; }

  /* 状态栏 */
  .status-bar { margin-top: 15px; padding: 8px 12px; background: var(--card); border-radius: var(--radius); display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sec); }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; margin-right: 5px; }
  .sync-dot.active { background: var(--warn); animation: pulse 1s infinite; }
  .sync-dot.ok { background: var(--success); }

  /* 模态框 */
  .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .modal { background: var(--card); padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; box-shadow: var(--shadow); }
  .modal h2 { margin-bottom: 15px; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-sec); }
  .form-row input { width: 100%; padding: 8px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
  .modal-btns button { flex: 1; padding: 10px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>

<header>
  <h1>📊 每日记录</h1>
  <div style="display:flex; gap:8px;">
    <button class="btn" onclick="app.syncNow()">🔄 同步</button>
    <button class="btn" onclick="ui.openSettings()">⚙️ 配置</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="ui.switchTab('tasks')">📝 事项列表</div>
  <div class="tab" onclick="ui.switchTab('expenses')">💰 记账本</div>
</div>

<div class="date-row">
  <label>日期：</label>
  <input type="date" id="dateInput">
</div>

<div class="content" id="mainContent">
  <!-- 动态渲染区 -->
</div>

<div class="status-bar">
  <span><span id="syncDot" class="sync-dot"></span><span id="syncText">未连接</span></span>
  <span id="lastSync">本地模式</span>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>☁️ GitHub 同步配置</h2>
    <div class="form-row"><label>用户名 / 仓库名</label><div style="display:flex; gap:5px;"><input id="cfg-owner" placeholder="Owner"><input id="cfg-repo" placeholder="Repo"></div></div>
    <div class="form-row"><label>Token (需勾选 repo 权限)</label><input id="cfg-token" type="password" placeholder="ghp_xxxx"><a href="https://github.com/settings/tokens" target="_blank" style="font-size:0.8rem; color:var(--accent); display:block; margin-top:4px;">获取 Token</a></div>
    <div class="form-row" style="display:flex; gap:5px;"><div style="flex:1"><label>分支</label><input id="cfg-branch" value="main"></div><div style="flex:1"><label>数据文件</label><input id="cfg-path" value="daily-data.json"></div></div>
    <div class="modal-btns">
      <button onclick="ui.closeSettings()">取消</button>
      <button class="btn-primary" onclick="app.saveConfig()">保存并启用</button>
    </div>
  </div>
</div>

<script>
/**
 * 核心逻辑：多端并发安全同步 + 事项/账本模块
 */
const app = {
  data: {},
  currentDate: new Date().toISOString().split('T')[0],
  config: JSON.parse(localStorage.getItem('sync_cfg') || ''),
  isSyncing: false,
  activeTab: 'tasks',
  pushTimer: null,

  init() {
    document.getElementById('dateInput').value = this.currentDate;
    this.loadLocal();
    this.bindEvents();
    this.render();
    if(this.config) { ui.setSync('ok', '已连接'); this.startSyncLoop(); }
    else { ui.setSync('', '未配置'); setTimeout(() => ui.openSettings(), 800); }
  },

  bindEvents() {
    document.getElementById('dateInput').addEventListener('change', (e) => {
      this.currentDate = e.target.value;
      this.render();
    });
  },

  // --- 数据管理 ---
  loadLocal() {
    const saved = localStorage.getItem('app_data_v2');
    this.data = saved ? JSON.parse(saved) : {};
    if(!this.data[this.currentDate]) this.data[this.currentDate] = { tasks: [], expenses: [], updatedAt: Date.now() };
  },

  saveLocal() {
    this.data[this.currentDate].updatedAt = Date.now();
    localStorage.setItem('app_data_v2', JSON.stringify(this.data));
  },

  // --- 渲染逻辑 ---
  render() {
    const day = this.data[this.currentDate] || { tasks: [], expenses: [], updatedAt: Date.now() };
    const box = document.getElementById('mainContent');
    
    if (this.activeTab === 'tasks') {
      let html = `<div style="color:var(--text-sec); font-size:0.9rem; margin-bottom:10px;">已完成: <b style="color:var(--success)">${day.tasks.filter(t=>t.done).length}</b> / ${day.tasks.length}</div>`;
      day.tasks.forEach(t => {
        html += `
          <div class="task-item">
            <input type="checkbox" class="task-check" ${t.done?'checked':''} onchange="app.updateTask('${t.id}','done',this.checked)">
            <input class="task-text" value="${t.text}" placeholder="输入事项..." oninput="app.updateTask('${t.id}','text',this.value)">
            <input class="task-note" value="${t.note||''}" placeholder="未完成原因/备注" oninput="app.updateTask('${t.id}','note',this.value)">
            <button class="del-btn" onclick="app.deleteTask('${t.id}')">×</button>
          </div>`;
      });
      html += `<button class="add-btn" onclick="app.addTask()">+ 添加新事项</button>`;
      box.innerHTML = html;
    } else {
      const total = day.expenses.reduce((s, e) => s + (parseFloat(e.amount)||0), 0).toFixed(2);
      let html = `
        <div class="exp-form">
          <input id="exp-cat" placeholder="分类 (如: 餐饮)">
          <input id="exp-amt" type="number" placeholder="金额" step="0.01">
          <input id="exp-note" placeholder="备注">
        </div>
        <button class="btn-primary" style="width:100%; margin-bottom:15px;" onclick="app.addExpense()">记账</button>
        ${day.expenses.map(e => `
          <div class="exp-item">
            <span>${e.category || '其他'} <small style="color:var(--text-sec)">· ${e.note||''}</small></span>
            <span class="exp-amount">¥${parseFloat(e.amount||0).toFixed(2)} <button class="del-btn" style="font-size:1rem; margin-left:8px;" onclick="app.deleteExpense('${e.id}')">×</button></span>
          </div>
        `).join('')}
        <div class="total-row"><span>今日合计</span><span style="color:var(--warn)">¥${total}</span></div>
      `;
      box.innerHTML = html;
    }
  },

  // --- 数据操作 ---
  genId() { return 'id_' + Date.now() + '_' + Math.floor(Math.random()*1000); },
  updateTask(id, field, val) {
    const t = this.data[this.currentDate].tasks.find(x => x.id === id);
    if(t) { t[field] = val; this.saveLocal(); this.triggerPush(); }
  },
  addTask() {
    this.data[this.currentDate].tasks.push({ id: this.genId(), text: '', done: false, note: '' });
    this.saveLocal(); this.render();
  },
  deleteTask(id) {
    this.data[this.currentDate].tasks = this.data[this.currentDate].tasks.filter(x => x.id !== id);
    this.saveLocal(); this.render();
  },
  addExpense() {
    const cat = document.getElementById('exp-cat').value;
    const amt = document.getElementById('exp-amt').value;
    const note = document.getElementById('exp-note').value;
    if(!amt) return ui.toast('请输入金额');
    this.data[this.currentDate].expenses.push({ id: this.genId(), category: cat, amount: amt, note });
    this.saveLocal(); this.render();
    document.getElementById('exp-amt').value = '';
    document.getElementById('exp-note').value = '';
  },
  deleteExpense(id) {
    this.data[this.currentDate].expenses = this.data[this.currentDate].expenses.filter(x => x.id !== id);
    this.saveLocal(); this.render();
  },

  // --- 同步引擎 (智能合并) ---
  triggerPush() {
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.pushToCloud(), 3000);
  },

  startSyncLoop() {
    if(window._syncInt) clearInterval(window._syncInt);
    window._syncInt = setInterval(() => {
      if(!document.hidden && !this.isSyncing) this.pullFromCloud();
    }, 5000);
  },

  async pullFromCloud() {
    if(!this.config || this.isSyncing) return;
    this.isSyncing = true;
    ui.setSync('active', '拉取中...');
    try {
      const { url, headers } = this._buildReq();
      const res = await fetch(url, { headers });
      if(res.ok) {
        const { content } = await res.json();
        const cloud = JSON.parse(decodeURIComponent(escape(atob(content))));
        this._mergeData(cloud);
        ui.setSync('ok', '已同步');
        this.render();
      } else if(res.status === 404) {
        ui.setSync('ok', '云端为空，准备首次上传');
        this.pushToCloud();
      }
    } catch(e) { console.warn('Pull failed', e); }
    finally { this.isSyncing = false; ui.updateTime(); }
  },

  _mergeData(cloud) {
    // 智能合并：按 ID 匹配，时间戳新的覆盖旧的，避免并发覆盖
    for(const date in cloud) {
      if(!this.data[date]) this.data[date] = { tasks: [], expenses: [], updatedAt: 0 };
      // 合并 tasks
      cloud[date].tasks.forEach(ct => {
        const lt = this.data[date].tasks.find(t => t.id === ct.id);
        if(!lt) this.data[date].tasks.push(ct);
        else if(ct.updatedAt > lt.updatedAt) Object.assign(lt, ct);
      });
      // 合并 expenses
      cloud[date].expenses.forEach(ce => {
        const le = this.data[date].expenses.find(e => e.id === ce.id);
        if(!le) this.data[date].expenses.push(ce);
        else if(ce.updatedAt > le.updatedAt) Object.assign(le, ce);
      });
      this.data[date].updatedAt = Math.max(this.data[date].updatedAt, cloud[date].updatedAt);
    }
    this.saveLocal();
  },

  async pushToCloud(retries=0) {
    if(!this.config) return;
    this.isSyncing = true;
    ui.setSync('active', '推送中...');
    try {
      const { url, headers } = this._buildReq();
      let sha = null;
      const head = await fetch(url, { headers });
      if(head.ok) sha = (await head.json()).sha;
      else if(head.status !== 404) throw new Error('HEAD fail');

      const body = {
        message: 'Auto Sync ' + this.currentDate,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(this.data)))),
        branch: this.config.branch
      };
      if(sha) body.sha = sha;

      const res = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) });
      if(!res.ok) {
        const err = await res.json();
        if(res.status === 422 && retries < 2) { // 冲突重试
          await this.pullFromCloud(); // 先拉最新
          return this.pushToCloud(retries+1);
        }
        throw new Error(err.message || 'Push 4xx/5xx');
      }
      ui.setSync('ok', '已保存');
    } catch(e) { console.error(e); ui.setSync('', '推送失败'); }
    finally { this.isSyncing = false; ui.updateTime(); }
  },

  _buildReq() {
    const c = this.config;
    return {
      url: `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}?ref=${c.branch}`,
      headers: { Authorization: `token ${c.token}`, Accept: 'application/vnd.github.v3+json' }
    };
  },

  syncNow() { if(!this.config) return ui.openSettings(); this.pullFromCloud(); this.pushToCloud(); },
  saveConfig() {
    const cfg = {
      owner: document.getElementById('cfg-owner').value.trim(),
      repo: document.getElementById('cfg-repo').value.trim(),
      branch: document.getElementById('cfg-branch').value.trim() || 'main',
      path: document.getElementById('cfg-path').value.trim() || 'daily-data.json',
      token: document.getElementById('cfg-token').value.trim()
    };
    if(!cfg.owner || !cfg.repo || !cfg.token) return ui.toast('信息不完整');
    this.config = cfg; localStorage.setItem('sync_cfg', JSON.stringify(cfg));
    ui.closeSettings(); ui.toast('配置成功'); this.startSyncLoop(); this.pullFromCloud();
  }
};

const ui = {
  switchTab(tab) {
    app.activeTab = tab;
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.textContent.includes(tab==='tasks'?'事项':'账本')));
    app.render();
  },
  setSync(state, txt) {
    document.getElementById('syncDot').className = 'sync-dot ' + (state==='active'?'active':state==='ok'?'ok':'');
    document.getElementById('syncText').textContent = txt;
  },
  updateTime() {
    document.getElementById('lastSync').textContent = '最后同步: ' + new Date().toLocaleTimeString();
  },
  openSettings() {
    const c = app.config || {};
    document.getElementById('cfg-owner').value = c.owner || '';
    document.getElementById('cfg-repo').value = c.repo || '';
    document.getElementById('cfg-branch').value = c.branch || 'main';
    document.getElementById('cfg-path').value = c.path || 'daily-data.json';
    document.getElementById('cfg-token').value = c.token || '';
    document.getElementById('settingsModal').style.display = 'flex';
  },
  closeSettings() { document.getElementById('settingsModal').style.display = 'none'; },
  toast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 16px; border-radius:20px; font-size:0.85rem; z-index:9999; opacity:0; transition:0.3s;';
    t.textContent = msg; document.body.appendChild(t);
    setTimeout(()=>t.style.opacity=1, 10); setTimeout(()=>{ t.style.opacity=0; setTimeout(()=>t.remove(), 300); }, 2500);
  }
};

document.addEventListener('visibilitychange', () => { if(!document.hidden && app.config) app.pullFromCloud(); });
window.onload = () => app.init();
</script>
</body>
</html>
